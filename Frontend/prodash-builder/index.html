<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden persistent Google Translate element — must NOT be display:none
         or Google Translate will skip creating the select.goog-te-combo widget -->
    <div id="google_translate_element"
         style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;"
         aria-hidden="true"></div>
    <!-- Google Translate Script -->
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,bn,te,mr,ta,gu,kn,ml,pa,or,as,bho,brx,doi,ks,kok,mai,mni,lus,ne,sa,sat,sd,ur',
          autoDisplay: false
        }, 'google_translate_element');
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
